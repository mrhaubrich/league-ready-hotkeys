[package]
name = "league-ready-hotkeys"
version = "0.1.0"
edition = "2021"
description = "Explicit F1/F2 controls for League of Legends ready checks"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
futures-util = "0.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"
] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
sysinfo = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
